<!doctype html><meta charset="utf-8"><title>Slit Scan Hybrid GPU regression</title>
<h1>Slit Scan Hybrid GPU parity</h1><pre id="result">Running…</pre>
<script type="module">
import { HybridTemporalGpu } from '/src/effects/time/HybridTemporalGpu.ts';
import { INPUT_HISTORY_SAMPLE_WGSL } from '/src/services/operators/inputHistorySampling.ts';
import { probeHybridRuntime } from './hybrid-runtime-probe.ts';
import { hybridTemporalWindow } from '/src/effects/time/hybridTemporalWindow.ts';
const result = document.querySelector('#result');

  const adapter = await navigator.gpu.requestAdapter(), device = await adapter.requestDevice();
  device.pushErrorScope('validation');
  const gpu = new HybridTemporalGpu(device), width = 256;

    usage:GPUTextureUsage.TEXTURE_BINDING|GPUTextureUsage.COPY_DST|GPUTextureUsage.RENDER_ATTACHMENT|GPUTextureUsage.COPY_SRC});

  const metadata = device.createBuffer({size:257*16,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_DST});

    map.set([.5,.5,i/255*4,1],i*4);}
  device.queue.writeTexture({texture:atlas},pixels,{bytesPerRow:4,rowsPerImage:1},[1,1,256]);
  device.queue.writeTexture({texture:current},input,{bytesPerRow:width*4},[width,1]);
  device.queue.writeTexture({texture:demand},map,{bytesPerRow:width*16},[width,1]);
  const sampler = device.createSampler({minFilter:'linear',magFilter:'linear'});

    @group(0) @binding(0) var atlas:texture_2d_array<f32>;
    @group(0) @binding(1) var ages:texture_2d<f32>;
    @group(0) @binding(2) var s:sampler;

  extended.set([1920,0,0,0],1920*4);

  device.queue.writeBuffer(large,0,extended);
  const largeNeeded=await gpu.needed(demand.createView(),large,width,1,1920);
  if(!largeNeeded.includes(1919)||!largeNeeded.some(i=>i>1080))throw Error('Large sample metadata was truncated');
  large.destroy();checks.push('PASS 1920 sample metadata and GPU demand bitset: frame 1919 requested');
  // Sparse 2-fps source: a dense temporal grid must still produce a smooth ramp.
  for (const [delay,factor] of [[4,1],[4,10],[60,1],[60,100]]) {
  const horizon=delay*factor;
  for(let i=0;i<width;i++)map.set([.5,.5,i/255*delay,1],i*4);
  device.queue.writeTexture({texture:demand},map,{bytesPerRow:width*16},[width,1]);

    Array.from({length:9},(_,i)=>({time:i/8*horizon,duration:horizon/8})));
  const smoothAges=device.createBuffer({size:window.metadata.byteLength,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_DST});
  device.queue.writeBuffer(smoothAges,0,window.metadata);
  window.times.forEach((time,i)=>pixels.set([Math.round(time/horizon*255),0,0,255],(i+1)*4));
  for(let i=0;i<width;i++)input.set([255,0,0,255],i*4);
  device.queue.writeTexture({texture:atlas},pixels,{bytesPerRow:4,rowsPerImage:1},[1,1,256]);
  device.queue.writeTexture({texture:current},input,{bytesPerRow:width*4},[width,1]);
  const smoothEncoder=device.createCommandEncoder(), smoothBuffers=[];
  for(let start=1;start<=window.times.length;start+=3) {
    const mapping=new Int32Array(window.times.length+1).fill(-1);if(start===1)mapping[0]=0;

    smoothBuffers.push(gpu.accumulate(smoothEncoder,demand.createView(),smoothAges,atlas.createView({dimension:'2d-array'}),current.createView(),output.createView(),mapping,start===1));
  }

  for(let i=0;i<width;i++)smoothError=Math.max(smoothError,Math.abs(half(smoothPixels[i*4])-(1-i/255)));
  smoothRead.unmap();smoothRead.destroy();smoothAges.destroy();smoothBuffers.forEach(b=>b.destroy());
  if(smoothError>.006)throw Error(`Source interpolation still has plateaus: ${smoothError}`);
  checks.push(`PASS ${factor}x factor, ${horizon}s source window: smooth full-width interpolation, max error ${smoothError}`);
  }

  const error=await device.popErrorScope();if(error)throw Error(error.message);

} catch(error) {result.textContent=`FAIL: ${error.stack??error}`;}
</script>
