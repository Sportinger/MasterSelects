<h1>Slit Scan filtering regression</h1><pre id="result">Running…</pre>
<script type="module">
import { SlitScanSeamSmoothing } from '/src/effects/time/slit-scan/SlitScanSeamSmoothing.ts';
import { SlitScanColorPyramid } from '/src/engine/native3d/passes/SlitScanColorPyramid.ts';

  const adapter=await navigator.gpu.requestAdapter(); if(!adapter)throw Error('WebGPU unavailable');
  const device=await adapter.requestDevice(); device.pushErrorScope('validation');
  const results=[], size=32;

  const texture=(w,h,format,data)=>{
    const t=device.createTexture({size:[w,h],format,usage:GPUTextureUsage.TEXTURE_BINDING|GPUTextureUsage.COPY_DST});

  const reader=device.createComputePipeline({layout:'auto',compute:{entryPoint:'main',module:device.createShaderModule({code:`

    @group(0) @binding(1) var<storage,read_write> data:array<vec4f>;
    @compute @workgroup_size(1) fn main(@builtin(global_invocation_id) id:vec3u) {

    }`})}});
  async function pixels(encoder,view,w,h) {
    const bytes=w*h*16, buffer=device.createBuffer({size:bytes,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_SRC});
    const read=device.createBuffer({size:bytes,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ});

  }

  const sampling={interpolation:'nearest',samples:[{delay:0,currentInput:true,contributions:[]},

  async function seam({radius=2,protection=0,mix=1,timeStep=true,contrast=false,alpha=false,linear=false}={}) {
    const data=new Uint8Array(size*size*4), query=new Float32Array(size*size*4);

  async function minified(transparency) {
    const data=new Uint8Array(64*64*4);
    for(let y=0;y<64;y++)for(let x=0;x<64;x++){
      const odd=(x+y)%2;
      data.set(transparency?(odd?[255,0,0,0]:[255,255,255,255]):[odd*255,odd*255,odd*255,255],(y*64+x)*4);
    }
    const input=texture(64,64,'rgba8unorm',data), geom=texture(1,1,'rgba32float',new Float32Array([0,0,0,1]));
    const color=device.createTexture({size:[32,32],format:'rgba8unorm',usage:GPUTextureUsage.RENDER_ATTACHMENT|GPUTextureUsage.TEXTURE_BINDING});
    const depth=device.createTexture({size:[32,32],format:'depth24plus',usage:GPUTextureUsage.RENDER_ATTACHMENT});

    surface.render(device,encoder,color.createView(),depth.createView(),[{mvp,reference:identity,inverseReference:identity,
      color:view,geometry:geom.createView(),columns:1,rows:1,timeDepth:0,opacity:1,premultiplied:true}],temporary);
    const values=await pixels(encoder,color.createView(),32,32);
    input.destroy();geom.destroy();color.destroy();depth.destroy();return Array.from(values.slice((16*32+16)*4,(16*32+16)*4+4));
  }

  const transparent=await minified(true);record('premultiplied mip chain avoids hidden red fringe',transparent.every(v=>Math.abs(v-.5)<.02),transparent);
  const error=await device.popErrorScope();if(error)throw Error(error.message);
  filter.destroy();pyramid.destroy();surface.dispose();temporary.forEach(b=>b.destroy());
  result.textContent=JSON.stringify({pass:results.every(r=>r.pass),results},null,2);
} catch(error) { result.textContent=`FAIL: ${error.stack??error}`; }
</script>
