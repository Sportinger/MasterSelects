<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>MasterSelects</title>
    <meta name="app-version" content="__APP_VERSION__" />

    <!-- Product description and social sharing -->
    <link rel="canonical" href="https://www.masterselects.com/" />
    <link rel="help" href="https://www.masterselects.com/about/" />
    <meta name="description" content="A browser-based media editor and agent-friendly foundation for creative tools. Edit video, audio, motion and 3D, build what you need, and contribute it back." />
    <meta property="og:title" content="MasterSelects" />
    <meta property="og:description" content="A browser-based media editor and agent-friendly foundation for creative tools. Edit video, audio, motion and 3D, build what you need, and contribute it back." />
    <meta property="og:image" content="https://www.masterselects.com/preview.png" />
    <meta property="og:url" content="https://www.masterselects.com" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Prevent theme flash on load -->
    <script>
      (function() {
        try {
          var settings = JSON.parse(localStorage.getItem('masterselects-settings') || '{}');
          var s = settings.state || settings;
          var theme = s.theme || 'dark';
          if (theme === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (theme === 'crazy' || theme === 'custom') {
            theme = 'dark'; // Crazy/Custom themes start from dark base, JS applies colors
          }
          if (theme !== 'dark') {
            document.documentElement.dataset.theme = theme;
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Product facts; technical tool documentation lives in /docs/. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "@id": "https://www.masterselects.com/#app",
        "name": "MasterSelects",
        "description": "A browser-based media editor and agent-friendly foundation for creative tools. Edit video, audio, motion and 3D, build what you need, and contribute it back.",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Web browser with WebGPU support",
        "url": "https://www.masterselects.com/",
        "subjectOf": "https://www.masterselects.com/about/",
        "sameAs": "https://github.com/Sportinger/MasterSelects",
        "license": "https://github.com/Sportinger/MasterSelects/blob/master/LICENSE",
        "featureList": [
          "Multitrack video editing, nested compositions, proxies and multicam",
          "Audio workstation with waveform and spectral editing, mixing and recording",
          "Motion graphics, keyframes, masks, face and surface tracking",
          "3D models, lights, cameras and Gaussian splats",
          "Live inputs and multiple preview outputs",
          "Touch and iPad optimized interface; phone workflows are still being refined",
          "Agent-friendly source code and a local bridge for editor control and performance diagnostics",
          "Community contributions of custom effects, tools and workflows"
        ]
      }
    </script>

    <noscript>
      <main>
        <h1>MasterSelects</h1>
        <p>A browser-based media editor and an agent-friendly foundation for creative tools.</p>
        <p>Edit video, mix audio, animate graphics, build 3D scenes, and work with live
          visuals in one workspace with WebGPU rendering and a multitrack timeline.</p>
        <h2>Build while you create</h2>
        <p>Run MasterSelects locally from source and have a coding agent build the
          effect, panel, or workflow your project needs. Try it in that same project,
          refine it, and contribute useful additions so others can build on them.</p>
        <p>The codebase includes architecture and feature documentation, reusable
          components, automated tests, and a local agent bridge for editor control
          and performance diagnostics.</p>
        <p>The interface is optimized for touch and iPad, with phone workflows still
          being refined. Editing and rendering run locally; hosted AI and media
          generation use external services and may require credits.</p>
        <p>The editor source is available under AGPL-3.0-only. MasterSelects is under
          active development; keep backups of important projects.</p>
        <p>Enable JavaScript and use a browser with WebGPU support to open the editor.
          You can read <a href="/about/">about MasterSelects</a> and the
          <a href="/docs/">documentation</a> without JavaScript.</p>
        <p>Explore the <a href="https://github.com/Sportinger/MasterSelects">source code
          and contribution guide</a>. Developers can find tool access and diagnostics
          in the <a href="/docs/features/ai-bridge-control/">agent bridge guide</a>.</p>
      </main>
    </noscript>
    <!-- Version check + explicit "?reset=true" handling (runs before any module loads).
         Kept external so the Content-Security-Policy allows it via 'self' instead of a per-release hash. -->
    <script src="/app-bootstrap.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
