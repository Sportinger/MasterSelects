name: Security Checks
on:
  pull_request:
    branches: [master, staging]
  push:
    # Staging is promoted from the already checked master commit.
    branches: [master]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint

  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run tests/unit/publicRepositoryBoundary.test.ts
      - run: npm run test:kernel-boundary
      - run: npm run test:normal-path-boundary

  unit-tests:
    name: Unit tests (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the reference video used by unit tests
        run: git lfs pull --include="fixtures/playwright-reference-project/media/x-rays-safe.mp4" --exclude=""
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run test -- --shard=${{ matrix.shard }}/6

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm audit --package-lock-only --audit-level=high
      - run: npm --prefix docs-site audit --package-lock-only --audit-level=high
        if: ${{ !cancelled() }}

  native-helper-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native helper system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path tools/native-helper/Cargo.toml --all-targets
      - run: cargo install cargo-audit --locked
      - run: cargo audit --file tools/native-helper/Cargo.lock

  secret-scanning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
